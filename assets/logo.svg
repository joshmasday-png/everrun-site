<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 -4 290 216" width="290" height="216" role="img" aria-label="Everrun">
  <defs>
    <linearGradient id="ern" gradientUnits="userSpaceOnUse" x1="40" y1="200" x2="200" y2="40">
      <stop offset="0" stop-color="#0A1628"/><stop offset=".45" stop-color="#1B3556"/><stop offset=".7" stop-color="#3A5F8C"/><stop offset="1" stop-color="#16294A"/>
    </linearGradient>
    <linearGradient id="erg" gradientUnits="userSpaceOnUse" x1="110" y1="205" x2="290" y2="5">
      <stop offset="0" stop-color="#1B3556"/><stop offset=".22" stop-color="#3A5F8C"/><stop offset=".42" stop-color="#8C6A2C"/>
      <stop offset=".62" stop-color="#E9CF8C"/><stop offset=".8" stop-color="#B08834"/><stop offset="1" stop-color="#F3E1A8"/>
    </linearGradient>
    <linearGradient id="erc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6CB86"/><stop offset="1" stop-color="#9C7630"/>
    </linearGradient>
    <filter id="ers" x="-10%" y="-10%" width="125%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- circuit traces fanning off the arrow -->
    <g stroke="url(#erc)" stroke-width="5">
      <path d="M254 98H284L294 88"/><path d="M247 124H296"/><path d="M234 150H262L274 162H288"/>
      <path d="M214 174L232 192H262"/><path d="M262 70L280 52"/>
    </g>
    <g stroke="url(#erc)" stroke-width="4.5" fill="#F5F3EE">
      <circle cx="300" cy="82" r="8"/><circle cx="305" cy="124" r="8"/><circle cx="297" cy="162" r="8"/><circle cx="271" cy="192" r="8"/><circle cx="286" cy="46" r="7"/>
    </g>
    <g fill="#C9A456" stroke="none"><circle cx="270" cy="98" r="3.5"/><circle cx="272" cy="124" r="3.5"/><circle cx="248" cy="150" r="3.5"/></g>
    <!-- the e: dark edge, metal body, top highlight -->
    <g filter="url(#ers)">
      <path d="M48 128H188A70 70 0 1 0 118 198" stroke="#081120" stroke-width="29"/>
      <path d="M48 128H188A70 70 0 1 0 118 198" stroke="url(#ern)" stroke-width="25"/>
      <path d="M64 86A62 62 0 0 1 150 66" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="3.5"/>
      <!-- node on the e, like the C2G mark -->
      <path d="M86 92L104 74" stroke="url(#erc)" stroke-width="4.5"/>
      <circle cx="110" cy="68" r="7.5" stroke="url(#erc)" stroke-width="4.5" fill="#1B3556"/>
      <circle cx="84" cy="94" r="5" fill="#C9A456" stroke="none"/>
      <!-- the tail becomes a rising gold arrow -->
      <path d="M117 198C185 198 238 150 262 62" stroke="#081120" stroke-width="29" stroke-linecap="butt"/>
      <path d="M117 198C185 198 238 150 262 62" stroke="url(#erg)" stroke-width="25" stroke-linecap="butt"/>
      <path d="M150 192C196 182 236 142 254 70" stroke="#FFFFFF" stroke-opacity=".32" stroke-width="3.5"/>
      <path d="M233 58L279 2L291 73Z" fill="url(#erg)" stroke="#081120" stroke-width="4"/>
      <path d="M244 56L276 17" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="3"/>
    </g>
  </g>
</svg>
